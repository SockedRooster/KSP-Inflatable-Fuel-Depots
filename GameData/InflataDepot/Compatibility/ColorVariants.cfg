// Cosmetic variants for all three InflataDepot sizes.
// KSP/Diffuse multiplies the original fabric by _Color: retain the weave,
// seams, UVs and animation. Only FabricCeramic is targeted; the docking base,
// gold restraint bands and nameplates keep their original appearance.
// Station Grey matches RoosterWorks Station Modules' steel palette (122,139,145).
// Original fabric median: (220, 224, 229); tint is target / median, rounded to 8-bit.
// Independent of B9's fuel selector. This patch survives Source/build.py rebuilds.
@PART[ID_FoldTank_125|ID_FoldTank_250|ID_FoldTank_375]
{
    MODULE
    {
        name = ModulePartVariants
        baseVariant = Original
        baseMass = 0
        baseCost = 0
        useMultipleDragCubes = false
        VARIANT
        {
            name = Original
            displayName = Original
            primaryColor = #DDE1E6
            secondaryColor = #CD8F32
            TEXTURE
            {
                materialName = FabricCeramic
                mainTextureURL = InflataDepot/Models/fabric
                _Color = #FFFFFF
            }
        }
        VARIANT
        {
            name = StationGrey
            displayName = Station Grey
            primaryColor = #7A8B91
            secondaryColor = #CD8F32
            TEXTURE
            {
                materialName = FabricCeramic
                mainTextureURL = InflataDepot/Models/fabric
                _Color = #8D9EA1
            }
        }
    }
}
