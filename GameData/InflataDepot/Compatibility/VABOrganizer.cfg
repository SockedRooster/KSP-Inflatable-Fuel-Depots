// RoosterWorks InflataDepot — optional VAB Organizer compatibility.
// The PART files already contain their own VABORGANIZER node. This patch
// reasserts the lfo / Rocket Fuel subcategory when VAB Organizer is present.
// Stock VAB remains in the FuelTank category with or without VAB Organizer.
@PART[ID_FoldTank_125|ID_FoldTank_250|ID_FoldTank_375]:NEEDS[VABOrganizer]:AFTER[VABOrganizer]
{
    %category = FuelTank
    %VABORGANIZER
    {
        %organizerSubcategory = lfo
    }
}
