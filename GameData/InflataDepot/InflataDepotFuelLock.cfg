// Source-preview feature; only activates after InflataDepotPlugin.dll has compiled and loaded.
// Add module after B9's switching module and stock animation; actual capacity is set at runtime.
@PART[ID_FoldTank_125]:NEEDS[InflataDepotPlugin,B9PartSwitch]:FINAL
{
    MODULE
    {
        name = ModuleInflataFuelLock
        nominalVolume = 2250
        inflationAnimation = inflate
    }
}
@PART[ID_FoldTank_250]:NEEDS[InflataDepotPlugin,B9PartSwitch]:FINAL
{
    MODULE
    {
        name = ModuleInflataFuelLock
        nominalVolume = 18000
        inflationAnimation = inflate
    }
}
@PART[ID_FoldTank_375]:NEEDS[InflataDepotPlugin,B9PartSwitch]:FINAL
{
    MODULE
    {
        name = ModuleInflataFuelLock
        nominalVolume = 60750
        inflationAnimation = inflate
    }
}
